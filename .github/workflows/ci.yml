name: CI

# Kiso itself: lint and tests on the newest Anki and on the oldest Kiso supports, and the
# real-Anki check on its stand-in add-on. The setup action is used from this checkout.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Anki ${{ matrix.anki }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            anki: latest
          - python: "3.10"
            anki: "==26.8.1"
    env:
      KISO_STRICT_ANKI_NOTICES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          python-version: ${{ matrix.python }}
          anki: ${{ matrix.anki }}
      - run: ruff check .
      - run: python -m pytest -q

  qt-checks:
    name: Real-Anki check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KISO_STRICT_ANKI_NOTICES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
      - run: python checks/check_runtime.py
